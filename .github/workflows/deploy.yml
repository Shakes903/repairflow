name: Build & Deploy (ACR -> Azure Web App)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/repairflow-api:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/repairflow-api:${{ github.sha }}

  update-webapp:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Point Web App to new image (SHA tag)
        uses: azure/cli@v2
        with:
          inlineScript: |
            az webapp config container set \
              --name ${{ secrets.AZURE_WEBAPP_NAME }} \
              --resource-group rg-repairflow-dev \
              --docker-custom-image-name ${{ secrets.ACR_LOGIN_SERVER }}/repairflow-api:${{ github.sha }} \
              --docker-registry-server-url https://${{ secrets.ACR_LOGIN_SERVER }} \
              --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
              --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}
